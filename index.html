<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>StudyMate</h1>
    <p>Plan your tasks, focus on your studies, and keep your notes in one place.</p>
  </header>

  <main>

    <!-- 1. STUDY TASKS -->
    <section id="tasks">
      <h2>Study tasks</h2>
      <form id="task-form">
        <input type="text" id="task-input" placeholder="e.g. Revise HTML forms" required>
        <select id="subject-select">
          <option value="Internet Programming">Internet Programming</option>
          <option value="Maths">Maths</option>
          <option value="Engineering Drawing">Engineering Drawing</option>
          <option value="Orientation to Computing">Orientation to Computing</option>
          <option value="Python Programming">Python Programming</option>
          <option value="Design Thinking">Design Thinking</option>
          <option value="Other">Other</option>
        </select>
        <button type="submit">Add task</button>
      </form>
      <p id="task-count"></p>
      <ul id="task-list"></ul>
    </section>

    <!-- 2. FOCUS TIMER -->
    <section id="timer">
      <h2>Focus timer</h2>
      <div id="time-display">25:00</div>
      <div class="buttons">
        <button id="start-btn">Start</button>
        <button id="pause-btn" class="secondary">Pause</button>
        <button id="reset-btn" class="secondary">Reset</button>
      </div>
      <label for="minutes-input">Minutes per session</label>
      <input type="number" id="minutes-input" value="25" min="1" max="120">
      <p id="session-count">Sessions completed: 0</p>
    </section>

    <!-- 3. NOTES -->
    <section id="notes">
      <h2>Quick notes</h2>
      <textarea id="notes-area" rows="8" placeholder="Write anything you want to remember..."></textarea>
      <p id="save-status">Notes save automatically.</p>
    </section>

  </main>

  <footer>
    <p>StudyMate &copy; 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
